<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
      <div class="main">
        <button id="theme-switcher-button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-dropdown">Switch Theme</button>

        <ul id="theme-dropdown" role="menu" aria-labelledby="theme-switcher-button" hidden>
            <li id="theme-light" role="menuitem" aria-controls="panel-light">Light</li>
            <li id="theme-dark" role="menuitem" aria-controls="panel-dark">Dark</li>
            <li id="theme-teal" role="menuitem" aria-controls="panel-teal">Teal</li>
        </ul>
      </div>
      <div id="theme-message" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
