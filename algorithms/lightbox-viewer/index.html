<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Viewer</title>
    <link rel="stylesheet" href="styles.css">
  </head>

<body>

    <div class="heading">
        <h1>Museum Gallery</h1>
    </div>

    <div class="gallery">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" class="gallery__item">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" class="gallery__item">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" class="gallery__item">
    </div>

    <div class="lightBox">
        <button id="close-btn">&times</button>
        <img src="" id="lightbox__image">
    </div>
    <script src="script.js"></script>
</body>
</html>
