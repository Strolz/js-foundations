<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Page metadata + global resources -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Counter</title>
    
    <!-- Core stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    
    <!-- Character Counter -->
    <section class="main">
        <h1>Real-Time Character Counter</h1>
    
        <div class="main__text">
            <textarea class="main__textbox" placeholder="Type Something..." id="text-input"></textarea>
        </div>

        <div class="main__counter">
            <p id="char-count">
                Character Count: 0/50
            </p>
        </div>

        <!-- Character counting script-->
        <script src="script.js"></script>
    </section>
</body>
</html>
