<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata + global resources -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Core stylesheet -->
    <link rel="stylesheet" href="styles.css" />
    <title>Calorie Counter</title>
  </head>
  <body>
    <main>
      <h1>Calorie Counter</h1>

      <!-- Main Calorie Meal Sections-->
      <div class="container">
        <form id="calorie-counter">
          <label for="budget">Budget</label>
          <input type="number" id="budget" min="0" placeholder="Daily calorie budget" required/>
          <fieldset id="breakfast">
            <legend>Breakfast</legend>
            <div class="input-container"></div>
          </fieldset>
          <fieldset id="lunch">
            <legend>Lunch</legend>
            <div class="input-container"></div>
          </fieldset>
          <fieldset id="dinner">
            <legend>Dinner</legend>
            <div class="input-container"></div>
          </fieldset>
          <fieldset id="snacks">
            <legend>Snacks</legend>
            <div class="input-container"></div>
          </fieldset>
          <fieldset id="exercise">
            <legend>Exercise</legend>
            <div class="input-container"></div>
          </fieldset>
          <div class="controls">
            
            <!-- Meal Selection Dropdown -->
            <span>
              <label for="entry-dropdown">Add food or exercise:</label>
              <select name="options" id="entry-dropdown">
                <option value="breakfast" selected>Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snacks">Snacks</option>
                <option value="exercise">Exercise</option>
              </select>
              
              <!-- Form Entry Buttons -->  
              <button id="add-entry">Add Entry</button>
            </span>
          </div>
            <div>
              <button type="submit">Calculate Remaining Calories</button>
              <button id="clear" type="button">Clear</button>
            </div>
        </form>
        <!-- Result Output -->
        <div id="output" class="output and hide"></div>     
      </div>
    </main>
    <!-- Core JS -->
    <script src="script.js"></script>
  </body>
</html>
