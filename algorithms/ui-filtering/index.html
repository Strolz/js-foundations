<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata + global resources -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Instruments product page</title>

    <!-- Core stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
<body>

  <h1>Student Instruments</h1>

  <main>
  
    <!-- Selection Menu -->
    <select class="select-container">
      <option id="all" value="all">All</option>
      <option id="woodwinds" value="woodwinds">Woodwinds</option>
      <option id="brass" value="brass">Brass</option>
      <option id="percussion" value="percussion">Percussion</option>
    </select>

    <!-- Instrument Selections-->
    <div class="products-container">
      <div class="card">
        <h2>Flute</h2>
        <p>$500</p>
      </div>
      <div class="card">
        <h2>Clarinet</h2>
        <p>$200</p>
      </div>
      <div class="card">
        <h2>Oboe</h2>
        <p>$4000</p>
      </div>
      <div class="card">
        <h2>Trumpet</h2>
        <p>$200</p>
      </div>
      <div class="card">
        <h2>Trombone</h2>
        <p>$300</p>
      </div>
      <div class="card">
        <h2>French Horn</h2>
        <p>$4300</p>
      </div>
      <div class="card">
        <h2>Drum Set</h2>
        <p>$500</p>
      </div>
      <div class="card">
        <h2>Xylophone</h2>
        <p>$3000</p>
      </div>
      <div class="card">
        <h2>Cymbals</h2>
        <p>$200</p>
      </div>
      <div class="card">
        <h2>Marimba</h2>
        <p>$3000</p>
      </div>
    </div>
  </main>

  <!-- UI filtering script -->
  <script src="script.js"></script>
</body>
</html>
